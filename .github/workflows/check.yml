name: check
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow builds nothing and publishes nothing, so a compromised dependency
# in the matrix cannot write to the repository.
permissions:
  contents: read

# A second push to the same branch makes the first run's verdict worthless before it lands.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # Every cell answers a different question; stopping at the first failure hides the rest.
      fail-fast: false
      matrix:
        # windows included deliberately: libs/shell.ts is Windows-specific spawn/kill code
        # that platform-parameterized unit tests cannot fully exercise.
        os: [ubuntu-latest, windows-latest]
        # 22 is the floor package.json declares (undici 8 needs 22.19 and does not even load
        # on 20) and what .node-version pins; 24 is the newer LTS. Node's own bundled undici
        # differs between them and prloop's global dispatcher still meets it, so testing only
        # one major leaves the other unproven.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # The whole suite is offline and takes seconds; ten minutes means something hung.
    timeout-minutes: 10
    steps:
      # Pinned by commit, not tag: a tag can be moved to different code after it was trusted.
      # Dependabot bumps the pin and its version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # The entry point is not covered by the selftests: they import modules, they never
      # start the CLI. Both flags exit 0 with no credentials, no endpoint and no network,
      # so a broken loop.ts, a fatal config parse or a missing tsx shows up here.
      - run: npm run prloop -- --help
      - run: npm run prloop -- --config

  # Separate job so a vulnerable dependency is reported as itself, not as "the Windows/Node 24
  # cell went red". Runtime deps only: undici is the only thing that reaches a user's machine.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
